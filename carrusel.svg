<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 280" width="100%" height="500" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px;">
  <defs>
    <style>
      .card { fill: #161b22; }
      .text-title { font-weight: bold; font-size: 15px; fill: #f0f6fc; }
      .text-tech { font-size: 13px; fill: #8b949e; }
      .text-score { font-weight: bold; font-size: 14px; }
      .arrow { stroke: #484f58; stroke-width: 2; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Task Tracker -->
    <g transform="translate(10, 20)">
      <rect x="0" y="0" width="180" height="210" rx="10" class="card" stroke="#8b5cf6" stroke-width="2"/>
      <text x="15" y="35" class="text-title">🟣 Task Tracker</text>
      <line x1="15" y1="48" x2="165" y2="48" stroke="#30363d"/>
      <text x="15" y="75" class="text-tech">C# / CLI</text>
      <text x="15" y="95" class="text-tech">JSON Persistence</text>
      <line x1="15" y1="168" x2="165" y2="168" stroke="#30363d"/>
      <text x="90" y="193" text-anchor="middle" class="text-score" fill="#8b5cf6">2/10</text>
    </g>

    <line x1="205" y1="125" x2="230" y2="125" class="arrow"/>

    <!-- Unit Converter -->
    <g transform="translate(235, 20)">
      <rect x="0" y="0" width="360" height="410" rx="10" class="card" stroke="#3b82f6" stroke-width="2"/>
      <text x="15" y="35" class="text-title">🔵 Unit Converter</text>
      <line x1="15" y1="48" x2="165" y2="48" stroke="#30363d"/>
      <text x="15" y="75" class="text-tech">ASP.NET Core</text>
      <text x="15" y="95" class="text-tech">REST API</text>
      <text x="15" y="115" class="text-tech">HTTP / JSON</text>
      <line x1="15" y1="168" x2="165" y2="168" stroke="#30363d"/>
      <text x="90" y="193" text-anchor="middle" class="text-score" fill="#3b82f6">3/10</text>
    </g>

    <line x1="430" y1="125" x2="455" y2="125" class="arrow"/>

    <!-- Todo List API -->
    <g transform="translate(460, 20)">
      <rect x="0" y="0" width="360" height="410" rx="10" class="card" stroke="#22c55e" stroke-width="2"/>
      <text x="15" y="35" class="text-title">🟢 Todo List API</text>
      <line x1="15" y1="48" x2="165" y2="48" stroke="#30363d"/>
      <text x="15" y="75" class="text-tech">.NET</text>
      <text x="15" y="95" class="text-tech">EF Core</text>
      <text x="15" y="115" class="text-tech">SQLite</text>
      <text x="15" y="135" class="text-tech">JWT / Auth</text>
      <line x1="15" y1="168" x2="165" y2="168" stroke="#30363d"/>
      <text x="90" y="193" text-anchor="middle" class="text-score" fill="#22c55e">5/10</text>
    </g>

    <line x1="655" y1="125" x2="680" y2="125" class="arrow"/>

    <!-- URL Shortener -->
    <g transform="translate(685, 20)">
      <rect x="0" y="0" width="360" height="410" rx="10" class="card" stroke="#eab308" stroke-width="2"/>
      <text x="15" y="35" class="text-title">🟡 URL Shortener</text>
      <line x1="15" y1="48" x2="165" y2="48" stroke="#30363d"/>
      <text x="15" y="75" class="text-tech">REST API</text>
      <text x="15" y="95" class="text-tech">EF Core</text>
      <text x="15" y="115" class="text-tech">SQLite</text>
      <text x="15" y="135" class="text-tech">Services / DTOs</text>
      <line x1="15" y1="168" x2="165" y2="168" stroke="#30363d"/>
      <text x="90" y="193" text-anchor="middle" class="text-score" fill="#eab308">5.5/10</text>
    </g>

    <line x1="880" y1="125" x2="905" y2="125" class="arrow"/>

    <!-- Ecommerce API -->
    <g transform="translate(910, 20)">
      <rect x="0" y="0" width="360" height="410" rx="10" class="card" stroke="#f97316" stroke-width="3"/>
      <text x="15" y="35" class="text-title">🟠 Ecommerce API</text>
      <line x1="15" y1="48" x2="165" y2="48" stroke="#30363d"/>
      <text x="15" y="70" class="text-tech">Clean Architecture</text>
      <text x="15" y="88" class="text-tech">PostgreSQL</text>
      <text x="15" y="106" class="text-tech">JWT / Identity</text>
      <text x="15" y="124" class="text-tech">Stripe / Webhooks</text>
      <text x="15" y="142" class="text-tech">Testing</text>
      <line x1="15" y1="168" x2="165" y2="168" stroke="#30363d"/>
      <text x="90" y="193" text-anchor="middle" class="text-score" fill="#f97316">7.5/10</text>
    </g>

    <line x1="1105" y1="125" x2="1130" y2="125" class="arrow"/>

    <!-- GestorDeCobrosIA -->
    <g transform="translate(1135, 20)">
      <rect x="0" y="0" width="400" height="450" rx="10" fill="#0d2818" stroke="#22c55e" stroke-width="3"/>
      <text x="15" y="35" class="text-title">🚀 GestorDeCobrosIA</text>
      <line x1="15" y1="48" x2="185" y2="48" stroke="#30363d"/>
      <text x="15" y="68" class="text-tech">Clean Architecture</text>
      <text x="15" y="85" class="text-tech">WhatsApp Webhooks</text>
      <text x="15" y="102" class="text-tech">AI / STT / LLM</text>
      <text x="15" y="119" class="text-tech">Idempotency</text>
      <text x="15" y="136" class="text-tech">Multi-tenancy</text>
      <text x="15" y="153" class="text-tech">Offline-first</text>
      <line x1="15" y1="168" x2="185" y2="168" stroke="#30363d"/>
      <text x="100" y="193" text-anchor="middle" class="text-score" fill="#22c55e">9/10</text>
    </g>
  </g>
</svg>
